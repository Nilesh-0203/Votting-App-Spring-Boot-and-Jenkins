version: "3.8"
services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pollapp
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    image: nilesh0203/poll-backend:latest
    container_name: backend
    restart: always
    depends_on:
      - mysql-db
    environment:
      DB_HOST: mysql-db
      DB_NAME: pollapp
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
    ports:
      - "8080:8080"

  frontend:
    image: nilesh0203/poll-frontend:latest
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data: